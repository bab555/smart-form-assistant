# 定义 upstream（启动时不要求后端存在，失败时会重试）
upstream backend_server {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver (Docker 内部 DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ========== iframe 嵌入配置 ==========
    # 允许被指定域名的页面通过 iframe 嵌入
    # 
    # 允许嵌入的父页面域名:
    #   - ps.szst.zjcqq.com / st.szst.zjcqq.com
    #   - ps.shian360.com / st.shian360.com
    #   - ps.caiquan.com / st.caiquan.com
    #
    # 注意: X-Frame-Options 的 ALLOW-FROM 已被废弃，现代浏览器使用 Content-Security-Policy
    add_header Content-Security-Policy "frame-ancestors 'self' https://ps.szst.zjcqq.com https://st.szst.zjcqq.com https://ps.shian360.com https://st.shian360.com https://ps.caiquan.com https://st.caiquan.com http://ps.szst.zjcqq.com http://st.szst.zjcqq.com http://ps.shian360.com http://st.shian360.com http://ps.caiquan.com http://st.caiquan.com" always;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend_server/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 增加超时设置，适应大文件上传和 LLM 推理
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 50M; # 允许大文件上传
    }

    # WebSocket 反向代理
    location /ws/ {
        proxy_pass http://backend_server/ws/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # WS 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
